<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Empire Origins</title><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font-family:system-ui}#game{width:100%;height:100%}.menu,.result{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#101827ee}.card{width:min(430px,calc(100% - 36px));padding:28px;box-sizing:border-box;border:1px solid #596979;border-radius:22px;background:#192637;text-align:center;box-shadow:0 20px 80px #0008}.card h1{letter-spacing:2px}.card p{color:#bcc8d2;line-height:1.5}.card button,.bar button{border:0;border-radius:11px;padding:11px 14px;margin:5px;background:#d9b66f;font-weight:700}.hud{position:fixed;inset:0;z-index:5;pointer-events:none}.top,.bar{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:9px}.pill{background:#172231eF;border:1px solid #526171;border-radius:12px;padding:7px 10px;font-size:13px}.bar{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,#0b111bee);pointer-events:auto}.panel{position:absolute;right:10px;top:60px;width:230px;padding:12px;border-radius:14px;background:#172231ee;border:1px solid #526171;display:none;pointer-events:auto}.panel.show{display:block}.hint{position:absolute;left:10px;top:60px;padding:9px;border-radius:12px;background:#172231dd;color:#d3dce3;font-size:12px}</style></head><body><div id="game"></div><div id="menu" class="menu"><div class="card"><div style="font-size:42px">✦</div><h1>EMPIRE ORIGINS</h1><p>Baue deine Siedlung, sammle Ressourcen, bilde Schwertkämpfer und zerstöre das gegnerische Dorfzentrum.</p><button onclick="newGame()">Neues Spiel</button><button onclick="continueGame()">Spiel fortsetzen</button><button onclick="clearSave()">Spielstand löschen</button><small>v0.1 · Browser-Prototyp</small></div></div><div id="hud" class="hud" style="display:none"><div id="top" class="top"></div><div class="hint">Einheit anklicken → Ziel anklicken. Rechtsklick/Drag bewegt die Kamera.</div><div id="panel" class="panel"></div><div id="bar" class="bar"></div></div><div id="result" class="result" style="display:none"><div class="card"><h2 id="rt"></h2><p id="rx"></p><button onclick="newGame()">Neues Spiel</button></div></div><script>
const KEY='empire-origins-v01',W=44,H=30,TW=54,TH=28;let S,G,scene,sel=null,build=null,drag=null,last=0;
const B={town:{n:'Dorfzentrum',w:0,f:0,t:0,h:900},house:{n:'Haus',w:50,f:0,t:20,h:300},farm:{n:'Bauernhof',w:70,f:0,t:18,h:260},lumber:{n:'Holzfäller',w:70,f:0,t:18,h:260},barracks:{n:'Kaserne',w:120,f:0,t:30,h:450}};
const U={villager:{n:'Dorfbewohner',h:70,a:4,d:1,s:2.4,r:1},swordsman:{n:'Schwertkämpfer',h:130,a:18,d:5,s:1.8,r:1,f:60,w:30,t:15}};
function mk(){S={seed:Math.random()*1e9,time:0,pause:false,end:null,p:{f:200,w:200,stone:100,iron:0,gold:0,cap:5,bs:[],us:[]},e:{f:200,w:200,stone:100,iron:0,gold:0,cap:5,bs:[],us:[]},b:{},u:{}};addB('p','town',7,15);addB('e','town',W-8,15);for(let i=0;i<5;i++){addU('p','villager',6+i,18,i<3?'f':'w');addU('e','villager',W-7-i,18,i<3?'f':'w')}return S}
function addB(o,t,x,y){let id='b'+Math.random();S.b[id]={id,o,t,x,y,hp:B[t].h,p:1,q:null};S[o].bs.push(id);return id}function addU(o,t,x,y,g){let id='u'+Math.random();S.u[id]={id,o,t,x,y,hp:U[t].h,g,tx:null,ty:null,target:null,cd:0};S[o].us.push(id);return id}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}function clearSave(){localStorage.removeItem(KEY);alert('Spielstand gelöscht.')}function newGame(){localStorage.removeItem(KEY);start()}function continueGame(){start()}
function tile(x,y){return Math.abs((Math.sin((x*9283+y*371)*.001+S.seed)*43758.5)%1)}function ter(x,y){if(x<0||y<0||x>=W||y>=H)return 4;let r=tile(x,y);return r<.07?2:r<.16?1:r<.22?3:r<.25?4:0}function wp(x,y){return{x:(x-y)*TW/2,y:(x+y)*TH/2}}function sw(px,py){let c=scene.cameras.main,z=c.zoom,sx=px/z+c.scrollX,sy=py/z+c.scrollY;return{x:(sy/(TH/2)+sx/(TW/2))/2,y:(sy/(TH/2)-sx/(TW/2))/2}}
class Main extends Phaser.Scene{constructor(){super('main')}create(){scene=this;this.g=this.add.graphics();this.cameras.main.setZoom(.9);this.cameras.main.centerOn((W/2)*TW/2,(H/2)*TH/2);this.input.on('pointerdown',p=>{drag={x:p.x,y:p.y,sx:this.cameras.main.scrollX,sy:this.cameras.main.scrollY,moved:false};});this.input.on('pointerup',p=>{if(drag&&!drag.moved)down(p);drag=null;});this.input.on('pointermove',p=>{if(drag){if(Math.hypot(p.x-drag.x,p.y-drag.y)>8)drag.moved=true;if(drag.moved){this.cameras.main.scrollX=drag.sx-(p.x-drag.x)/this.cameras.main.zoom;this.cameras.main.scrollY=drag.sy-(p.y-drag.y)/this.cameras.main.zoom}}});this.input.on('wheel',(_p,_g,_dx,dy)=>this.cameras.main.setZoom(Phaser.Math.Clamp(this.cameras.main.zoom-dy*.001,.55,1.6)));draw();hud()}update(t,ms){if(!S||S.pause||S.end)return;let d=Math.min(ms/1000,.1);S.time+=d;res(d);prod(d);move(d);fight(d);ai(d);if(t-last>4000){save();last=t}draw();hud()}}
function down(p){if(p.rightButtonDown()){drag={x:p.x,y:p.y,sx:scene.cameras.main.scrollX,sy:scene.cameras.main.scrollY};return}let q=sw(p.x,p.y);if(build){if(place(build,Math.floor(q.x),Math.floor(q.y)))build=null;hud();return}let hit=null;for(let id of S.p.us){let u=S.u[id];if(u&&Math.hypot(u.x-q.x,u.y-q.y)<.8)hit=id}for(let id of S.p.bs){let b=S.b[id];if(b&&Math.hypot(b.x-q.x,b.y-q.y)<1.2)hit=id}if(hit){sel=hit;hud();return}if(sel&&S.u[sel]){let target=enemyAt(q.x,q.y);if(target)S.u[sel].target=target;else{S.u[sel].tx=q.x;S.u[sel].ty=q.y;S.u[sel].target=null}}hud()}
function enemyAt(x,y){let best=null,d=1.4;for(let id of S.e.us){let u=S.u[id],n=Math.hypot(u.x-x,u.y-y);if(n<d){d=n;best=id}}for(let id of S.e.bs){let b=S.b[id],n=Math.hypot(b.x-x,b.y-y);if(n<d){d=n;best=id}}return best}
function res(d){for(let o of ['p','e']){let p=S[o];for(let id of p.us){let u=S.u[id];if(u?.t==='villager'&&u.g)p[u.g]+=10/60*d}for(let id of p.bs){let b=S.b[id];if(b?.p>=1){if(b.t==='farm')p.f+=4/60*d;if(b.t==='lumber')p.w+=4/60*d}}}}
function prod(d){for(let o of ['p','e'])for(let id of S[o].bs){let b=S.b[id];if(!b?.q)continue;b.q.time-=d;if(b.q.time<=0){addU(o,b.q.type,b.x+1,b.y,b.q.type==='villager'?'f':null);b.q=null}}for(let b of Object.values(S.b))if(b.p<1)b.p=Math.min(1,b.p+d/B[b.t].t)}
function move(d){for(let u of Object.values(S.u)){if(u.target||u.tx==null)continue;let dx=u.tx-u.x,dy=u.ty-u.y,l=Math.hypot(dx,dy)||1,v=U[u.t].s*d;if(l<=v){u.x=u.tx;u.y=u.ty;u.tx=u.ty=null}else{u.x+=dx/l*v;u.y+=dy/l*v}}}
function fight(d){for(let u of Object.values(S.u)){if(!u.target)continue;let z=S.u[u.target]||S.b[u.target];if(!z){u.target=null;continue}let l=Math.hypot(z.x-u.x,z.y-u.y);if(l>U[u.t].r+.5){u.tx=z.x;u.ty=z.y;continue}u.cd-=d;if(u.cd<=0){let def=z.t?0:(U[z.t]?.d||0);z.hp-=Math.max(1,U[u.t].a-def);u.cd=1}}for(let id of Object.keys(S.u))if(S.u[id].hp<=0)dead(id);for(let id of Object.keys(S.b))if(S.b[id].hp<=0){let b=S.b[id],o=b.o;S[o].bs=S[o].bs.filter(x=>x!==id);delete S.b[id];if(b.t==='town'){S.end=o==='p'?'lose':'win';finish()}}}
function dead(id){let u=S.u[id];S[u.o].us=S[u.o].us.filter(x=>x!==id);delete S.u[id]}
function place(t,x,y){let p=S.p,d=B[t];if(x<1||y<1||x>=W-1||y>=H-1||[2,4].includes(ter(x,y))||Object.values(S.b).some(b=>Math.hypot(b.x-x,b.y-y)<1.3)||p.w<d.w||p.f<d.f)return false;p.w-=d.w;p.f-=d.f;let id=addB('p',t,x,y);S.b[id].p=d.t?0:1;if(t==='house')p.cap+=5;return true}
function train(){let b=Object.values(S.b).find(b=>b.o==='p'&&b.t==='barracks'&&b.p>=1&&!b.q),p=S.p,u=U.swordsman;if(!b||p.us.length>=p.cap||p.f<u.f||p.w<u.w)return;p.f-=u.f;p.w-=u.w;b.q={type:'swordsman',time:u.t}}
function villager(){let b=Object.values(S.b).find(b=>b.o==='p'&&b.t==='town'&&b.p>=1&&!b.q),p=S.p;if(!b||p.us.length>=p.cap||p.f<50)return;p.f-=50;b.q={type:'villager',time:10}}
function ai(){let p=S.e,tc=p.bs.map(id=>S.b[id]).find(b=>b?.t==='town'&&b.p>=1);if(tc&&p.us.length<p.cap&&!tc.q&&p.f>=50){p.f-=50;tc.q={type:'villager',time:8}}let br=p.bs.map(id=>S.b[id]).find(b=>b?.t==='barracks');if(!br&&p.w>=120&&tc){p.w-=120;addB('e','barracks',tc.x+3,tc.y)}br=p.bs.map(id=>S.b[id]).find(b=>b?.t==='barracks'&&b.p>=1);if(br&&!br.q&&p.f>=60&&p.w>=30){p.f-=60;p.w-=30;br.q={type:'swordsman',time:15}}let army=p.us.map(id=>S.u[id]).filter(u=>u?.t==='swordsman');if(army.length>=3){let tcid=S.p.bs.find(id=>S.b[id]?.t==='town');for(let u of army)u.target=tcid}}
function draw(){let g=scene.g;g.clear();for(let y=0;y<H;y++)for(let x=0;x<W;x++){let p=wp(x,y),c=[0x5d9a60,0x3f7548,0x397a9e,0x85827a,0x686b74][ter(x,y)];g.fillStyle(c);g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+TW/2,p.y+TH/2);g.lineTo(p.x,p.y+TH);g.lineTo(p.x-TW/2,p.y+TH/2);g.closePath();g.fillPath()}for(let b of Object.values(S.b)){let p=wp(b.x,b.y),c=b.o==='p'?0xc69a53:0x99565f;g.fillStyle(c);g.fillRect(p.x-18,p.y+7,36,22);g.fillStyle(0xe7d5a4);g.fillTriangle(p.x-22,p.y+8,p.x,p.y-12,p.x+22,p.y+8);g.fillStyle(0x222);g.fillRect(p.x-20,p.y-25,40,3);g.fillStyle(0x70c77a);g.fillRect(p.x-20,p.y-25,40*Math.max(0,b.hp/B[b.t].h),3);if(b.p<1){g.fillStyle(0x6bcf83);g.fillRect(p.x-20,p.y-19,40*b.p,4)}}for(let u of Object.values(S.u)){let p=wp(u.x,u.y),c=u.o==='p'?0xe9e2d0:0xd95c5c;g.fillStyle(c);g.fillCircle(p.x,p.y+4,u.t==='villager'?7:9);g.fillStyle(0x6bd17b);g.fillRect(p.x-7,p.y-13,14*Math.max(0,u.hp/U[u.t].h),3);if(u.id===sel){g.lineStyle(2,0xffdf75);g.strokeCircle(p.x,p.y+4,12)}}}
function hud(){if(!S)return;document.getElementById('top').innerHTML=`<span class=pill>🍖 ${S.p.f|0}</span><span class=pill>🪵 ${S.p.w|0}</span><span class=pill>🪨 ${S.p.stone}</span><span class=pill>⛓️ ${S.p.iron}</span><span class=pill>🪙 ${S.p.gold}</span><span class=pill>👥 ${S.p.us.length}/${S.p.cap}</span><span class=pill>⏱️ ${S.time|0}s</span><button class=pill onclick="S.pause=!S.pause">${S.pause?'▶':'⏸'}</button>`;let o=sel?(S.u[sel]||S.b[sel]):null,p=document.getElementById('panel');p.className='panel'+(o?' show':'');if(o){let d=o.t?B[o.t]:U[o.t];p.innerHTML=`<b>${d.n}</b><div>HP: ${o.hp|0}/${d.h}</div>${o.g?`<div>Sammelt: ${o.g==='f'?'Nahrung':'Holz'}</div>`:''}${o.t==='town'&&o.p>=1&&!o.q?'<button onclick="villager()">👨‍🌾 Dorfbewohner · 50🍖</button>':''}${o.t==='barracks'&&o.p>=1&&!o.q?'<button onclick="train()">⚔️ Schwertkämpfer · 60🍖 30🪵</button>':''}`}document.getElementById('bar').innerHTML=['house','farm','lumber','barracks'].map(t=>`<button onclick="build='${t}'">${B[t].n}<br><small>${B[t].w}🪵 · ${B[t].t}s</small></button>`).join('')}
function finish(){document.getElementById('rt').textContent=S.end==='win'?'Sieg!':'Niederlage';document.getElementById('rx').textContent=S.end==='win'?'Das gegnerische Dorfzentrum wurde zerstört.':'Dein Dorfzentrum wurde zerstört.';document.getElementById('result').style.display='grid';save()}
function start(){document.getElementById('menu').style.display='none';document.getElementById('hud').style.display='block';S=load()||mk();G=new Phaser.Game({type:Phaser.AUTO,parent:'game',width:innerWidth,height:innerHeight,backgroundColor:'#101827',scale:{mode:Phaser.Scale.RESIZE},scene:Main,render:{antialias:true}});}
</script><script>
window.addEventListener('error',function(e){
 if(!window.Phaser){
  document.body.innerHTML='<div style="padding:32px;color:white;font-family:system-ui;background:#101827;min-height:100vh"><h1>Empire Origins</h1><p>Die Spielbibliothek konnte nicht geladen werden. Bitte Internetverbindung prüfen und die Seite neu laden.</p></div>';
 }
});
</script></body></html>
