<html lang="de">

<meta name="description" content="Eine kleine lebendige Welt. Kümmere dich um deinen Mitbewohner, spiele, dekoriere und entdecke.">
<title>Miniwelt – Dein kleiner Mitbewohner</title>
<style>

*{box-sizing:border-box}html{background:var(--cream);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#fff 0,transparent 42%),var(--cream)}button{font:inherit;cursor:pointer;border:0;transition:transform .15s,filter .15s}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #6b8fe8;outline-offset:3px}.app{max-width:1180px;margin:auto;padding:20px 22px 34px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#ffdf8b,#f7b7bd);font-size:25px;box-shadow:0 5px 14px #c99b7030}.brand h1{font-size:21px;letter-spacing:-.7px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.pill{border-radius:999px;padding:10px 14px;background:white;color:var(--ink);font-weight:800;box-shadow:0 3px 12px #51422a0c}.coin-pill{background:#fff3ca;color:#785719}.icon-btn{width:42px;height:42px;border-radius:15px;background:white;font-size:19px;box-shadow:0 3px 12px #51422a0c}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:20px;align-items:start}.world-card,.panel{background:var(--paper);border:1px solid #eee7dd;border-radius:28px;box-shadow:var(--shadow);overflow:hidden}.world-head{padding:21px 23px 0;display:flex;justify-content:space-between;align-items:start;gap:12px}.eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:10px;font-weight:900;color:#a18e7a}.world-head h2{margin:5px 0 0;font-size:25px;letter-spacing:-1px}.weather{border-radius:14px;background:#f3f7ff;color:#637cae;padding:9px 12px;font-size:12px;font-weight:800;white-space:nowrap}.room{margin:16px 16px 0;border-radius:23px;min-height:420px;position:relative;overflow:hidden;background:linear-gradient(#dbeaf5 0 55%,#f7dfcc 55% 58%,#e6c4a4 58% 100%)}.window{position:absolute;top:28px;right:28px;width:104px;height:135px;border:8px solid #fff9f1;border-radius:20px;background:linear-gradient(#9bc6ed 0 50%,#b7dba8 50%);box-shadow:0 8px 20px #6c7f8b16}.window:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:5px;background:#fff9f1}.window:after{content:"";position:absolute;left:0;right:0;top:48%;height:5px;background:#fff9f1}.sun{position:absolute;top:42px;left:33px;width:42px;height:42px;border-radius:50%;background:#ffe4a0;box-shadow:0 0 0 12px #ffe4a033}.shelf{position:absolute;right:22px;bottom:94px;width:110px;height:78px;border-radius:12px 12px 4px 4px;background:#d6a77e;box-shadow:inset 0 8px #e9c39f}.shelf:before{content:"";position:absolute;left:-8px;right:-8px;top:-8px;height:13px;border-radius:8px;background:#edc9a5}.plant{position:absolute;right:48px;bottom:176px;font-size:46px;filter:drop-shadow(0 4px 2px #5e3e2918)}.rug{position:absolute;bottom:17px;left:8%;width:84%;height:100px;border-radius:50%;background:#fff9f0;border:3px solid #f2e6d9;box-shadow:0 8px 0 #d7b89b55}.toy{position:absolute;bottom:46px;left:14%;font-size:35px;transform:rotate(-15deg)}.food-bowl{position:absolute;bottom:33px;right:12%;font-size:37px}.character-wrap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:min(56%,290px);height:350px;display:flex;align-items:end;justify-content:center;z-index:2}.character{height:100%;width:100%;object-fit:contain;object-position:center bottom;mix-blend-mode:multiply;filter:drop-shadow(0 13px 10px #72533b18);animation:bob 3.2s ease-in-out infinite;cursor:pointer}.character.happy{animation:happy .65s ease-in-out 2}.character.sleeping{filter:grayscale(.25) brightness(.86);animation:none}.character.sick{filter:saturate(.65)}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes happy{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-4deg) translateY(-13px)}70%{transform:rotate(4deg) translateY(-8px)}}.speech{position:absolute;left:20px;top:28px;z-index:3;max-width:45%;background:#fffdf8;padding:12px 15px;border-radius:18px 18px 18px 5px;box-shadow:0 6px 20px #6d65531a;font-weight:800;font-size:13px;line-height:1.35}.speech:after{content:"";position:absolute;bottom:-7px;left:15px;border-width:8px 8px 0 0;border-style:solid;border-color:#fffdf8 transparent transparent transparent}.mood-tag{position:absolute;top:95px;left:22px;background:#ffffffb8;backdrop-filter:blur(8px);border:1px solid #ffffffc9;padding:8px 11px;border-radius:99px;font-size:11px;font-weight:900;color:#6e7b8d}.room-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 22px 21px}.level-info strong{display:block;font-size:14px}.level-info span{font-size:12px;color:var(--muted)}.xp{width:130px;height:7px;border-radius:99px;background:#eee9e1;overflow:hidden;margin-top:7px}.xp span{display:block;height:100%;width:35%;border-radius:99px;background:linear-gradient(90deg,#91cdb5,#6f9be9);transition:width .3s}.tiny-btn{border-radius:13px;background:#f2f5ff;color:#5c79c4;padding:11px 13px;font-size:12px;font-weight:900}.right-col{display:grid;gap:17px}.panel{padding:21px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.panel h3{margin:0;font-size:17px;letter-spacing:-.4px}.panel-head small{color:var(--muted);font-weight:700}.stats{display:grid;gap:14px}.stat{display:grid;grid-template-columns:35px 1fr 40px;align-items:center;gap:10px}.stat-emoji{width:35px;height:35px;border-radius:12px;background:#f8f2e9;display:grid;place-items:center;font-size:17px}.stat-name{font-size:12px;font-weight:850;margin-bottom:6px}.bar{height:8px;border-radius:99px;background:#f0ece6;overflow:hidden}.bar span{height:100%;display:block;border-radius:99px;transition:width .35s}.stat-value{text-align:right;font-size:12px;font-weight:900;color:#6f7b8c}.actions-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{min-height:89px;border-radius:18px;background:#f7f4ee;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ink);font-weight:900}.action .emoji{font-size:25px}.action span:last-child{font-size:11px}.action.feed{background:#fff1d0}.action.play{background:#e7efff}.action.wash{background:#e3f6ef}.action.sleep{background:#eee8ff}.action.treat{background:#ffe8ef}.action.clean{background:#e9f4f8}.action:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.3)}.bottom-nav{display:flex;gap:8px;margin-top:20px;padding:8px;background:#fffdf9;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 5px;background:transparent;color:#9b9aa0;border-radius:16px;font-size:11px;font-weight:900}.nav-btn .nav-icon{font-size:20px}.nav-btn.active{background:#eef2ff;color:#5d79c7}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#25324a;color:white;padding:13px 18px;border-radius:16px;box-shadow:0 12px 35px #24304730;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:calc(100vw - 32px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{position:fixed;inset:0;background:#1e293b66;backdrop-filter:blur(5px);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.open{display:flex}.modal{width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--paper);border-radius:27px;padding:23px;box-shadow:0 24px 80px #15223835}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-top h2{font-size:22px;margin:0}.close{width:38px;height:38px;border-radius:13px;background:#f4efe7;font-size:18px}.shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shop-item{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fffefa}.shop-art{height:80px;border-radius:13px;background:#f6f1e8;display:grid;place-items:center;font-size:39px;margin-bottom:10px}.shop-item strong{display:block;font-size:13px}.shop-item p{font-size:11px;color:var(--muted);margin:4px 0 12px}.buy{width:100%;border-radius:12px;background:#edf1ff;color:#5574c2;padding:10px;font-weight:900;font-size:12px}.buy:disabled{opacity:.45}.log{display:grid;gap:9px}.log-row{display:flex;align-items:center;gap:11px;padding:12px;border-radius:15px;background:#f8f4ed;font-size:12px;font-weight:800}.log-row span{font-size:21px}.name-input{width:100%;border:1px solid #e9e0d5;border-radius:14px;padding:13px;font:inherit;background:#fff}.primary{background:#637fdb;color:white;padding:13px 16px;border-radius:14px;font-weight:900}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:800}.settings-row:last-child{border-bottom:0}.danger{background:#fff0ee;color:#c65d56}.empty-note{font-size:12px;color:var(--muted);line-height:1.5}.mini-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:99px;background:#f3f0ea;color:#8b7d6b;font-size:10px;font-weight:900}
@media(max-width:800px){.app{padding:15px 13px 24px}.layout{grid-template-columns:1fr;gap:15px}.room{min-height:405px;margin:13px 12px 0}.character-wrap{height:320px;width:min(62%,285px)}.world-head{padding:19px 19px 0}.world-head h2{font-size:23px}.right-col{grid-template-columns:1fr}.panel{padding:19px}.bottom-nav{position:sticky;bottom:8px;z-index:10;margin-top:15px;background:#fffdf9f2;backdrop-filter:blur(15px)}.nav-btn{padding:9px 3px}.nav-btn .nav-icon{font-size:19px}.speech{font-size:12px;max-width:48%;top:22px;left:15px}.window{right:20px;top:22px;transform:scale(.9);transform-origin:top right}.mood-tag{left:15px;top:88px}}
@media(min-width:801px){.right-col{position:sticky;top:16px}.bottom-nav{max-width:650px;margin-left:auto;margin-right:auto}.room{min-height:470px}.character-wrap{height:390px}}
@media(max-width:390px){.room{min-height:365px}.character-wrap{height:285px;width:65%}.speech{max-width:52%;padding:10px 11px;font-size:11px}.window{transform:scale(.75)}.actions-grid{gap:7px}.action{min-height:80px}.action .emoji{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">🌱</div><div><h1>Miniwelt</h1><p>Ein kleines Zuhause voller Leben</p></div></div>
  <div class="top-actions"><div class="pill coin-pill">🪙 <span id="coins">120</span></div><button class="icon-btn" id="settingsBtn" aria-label="Einstellungen">⚙️</button></div>
</header>
<main class="layout">
<section class="world-card">
  <div class="world-head"><div><div class="eyebrow">Dein Zuhause</div><h2 id="roomTitle">Ein gemütlicher Anfang</h2></div><div class="weather">☀️ Wohlfühlwetter</div></div>
  <div class="room" id="room">
    <div class="sun"></div><div class="window"></div><div class="shelf"></div><div class="plant" id="plantDecor">🪴</div>
    <div class="speech" id="speech">Hey! Schön, dass du da bist! 👋</div><div class="mood-tag" id="moodTag">😊 Gut gelaunt</div>
    <div class="rug"></div><div class="toy" id="toyDecor">🧸</div><div class="food-bowl" id="bowlDecor">🥣</div>
    <div class="character-wrap"><img class="character" id="character" src="charakter.jpg" alt="Dein fröhlicher Mitbewohner winkt dir zu" title="Tippe auf deinen Mitbewohner!"></div>
  </div>
  <div class="room-footer"><div class="level-info"><strong><span id="petNameLabel">Milo</span> · Level <span id="level">1</span></strong><span id="xpLabel">Noch ganz am Anfang</span><div class="xp"><span id="xpBar"></span></div></div><button class="tiny-btn" id="dailyBtn">🎁 Tagesgeschenk</button></div>
</section>
<aside class="right-col">
  <section class="panel"><div class="panel-head"><h3>So geht’s <span id="petNameHeading">Milo</span></h3><small id="lastUpdate">gerade eben</small></div><div class="stats" id="stats"></div></section>
  <section class="panel"><div class="panel-head"><h3>Was machen wir?</h3><span class="mini-badge">✨ Für dich</span></div><div class="actions-grid">
    <button class="action feed" data-action="feed"><span class="emoji">🍎</span><span>Füttern</span></button>
    <button class="action play" data-action="play"><span class="emoji">🎾</span><span>Spielen</span></button>
    <button class="action wash" data-action="wash"><span class="emoji">🛁</span><span>Waschen</span></button>
    <button class="action sleep" data-action="sleep"><span class="emoji">🌙</span><span>Schlafen</span></button>
    <button class="action treat" data-action="treat"><span class="emoji">🍪</span><span>Leckerli</span></button>
    <button class="action clean" data-action="clean"><span class="emoji">🧹</span><span>Aufräumen</span></button>
  </div></section>
  <section class="panel"><div class="panel-head"><h3>Kleine Erfolge</h3><small id="achievementCount">0 von 5</small></div><div class="log" id="achievements"></div></section>
</aside>
</main>
<nav class="bottom-nav" aria-label="Spielmenü">
<button class="nav-btn active" data-tab="home"><span class="nav-icon">🏡</span> Zuhause</button>
<button class="nav-btn" data-tab="shop"><span class="nav-icon">🛍️</span> Laden</button>
<button class="nav-btn" data-tab="collection"><span class="nav-icon">🎒</span> Sammlung</button>
<button class="nav-btn" data-tab="journal"><span class="nav-icon">📖</span> Tagebuch</button>
</nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-top"><h2 id="modalTitle">Miniwelt</h2><button class="close" id="closeModal" aria-label="Schließen">✕</button></div><div id="modalContent"></div></section></div>
<script>
(()=> {
'use strict';
const $=id=>document.getElementById(id);
const clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,n));
const now=()=>Date.now();
const defaults=()=>({name:'Milo',coins:120,level:1,xp:0,stats:{hunger:78,happiness:82,energy:76,hygiene:88,health:100},lastTick:now(),lastGift:0,inventory:['teddy','bowl','plant'],decor:{rug:'rug',toy:'teddy',plant:'plant',bowl:'bowl'},journal:[{icon:'🌱',text:'Deine Miniwelt ist eingezogen. Ein neues Abenteuer beginnt!',time:now()}],achievements:{firstFeed:false,playful:false,clean:false,collector:false,level2:false},actions:{feed:0,play:0,wash:0},sleeping:false});
let state;
try{state=JSON.parse(localStorage.getItem('miniWeltSaveV1'))||defaults()}catch(e){state=defaults()}
let toastTimer;
function save(){try{localStorage.setItem('miniWeltSaveV1',JSON.stringify(state))}catch(e){}}
function addLog(icon,text){state.journal.unshift({icon,text,time:now()});state.journal=state.journal.slice(0,35)}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function setStat(key,amount){state.stats[key]=clamp(state.stats[key]+amount)}
function gainXP(n){state.xp+=n;let leveled=false;while(state.xp>=100){state.xp-=100;state.level++;state.coins+=35;leveled=true;addLog('⭐',`Level ${state.level} erreicht! Du bekommst 35 Münzen.`)}if(leveled)toast(`Levelaufstieg! 🎉 Du bist jetzt Level ${state.level}.`)}
function tick(){let elapsed=Math.min(24*60*60*1000,now()-(state.lastTick||now()));let units=elapsed/60000;if(units>0){state.stats.hunger=clamp(state.stats.hunger-units*.14);state.stats.happiness=clamp(state.stats.happiness-units*.055);state.stats.hygiene=clamp(state.stats.hygiene-units*.045);if(!state.sleeping)state.stats.energy=clamp(state.stats.energy-units*.07);else state.stats.energy=clamp(state.stats.energy+units*.5);if(state.stats.hunger<15||state.stats.hygiene<12)state.stats.health=clamp(state.stats.health-units*.035);else if(state.stats.hunger>40&&state.stats.hygiene>40)state.stats.health=clamp(state.stats.health+units*.012);state.lastTick=now();save()}}
const statMeta=[
 ['hunger','🍎','Hunger','#f1bd58',()=>state.stats.hunger<25?'Hungrig':state.stats.hunger<55?'Könnte snacken':'Satt'],
 ['happiness','💖','Glück','#ef91a7',()=>state.stats.happiness<25?'Traurig':state.stats.happiness<55?'Ganz okay':'Glücklich'],
 ['energy','⚡','Energie','#9c8ce9',()=>state.stats.energy<25?'Müde':state.stats.energy<55?'Etwas schlapp':'Fit'],
 ['hygiene','🫧','Sauberkeit','#76cbb2',()=>state.stats.hygiene<25?'Ein Bad wäre toll':state.stats.hygiene<55?'Etwas staubig':'Frisch'],
 ['health','🌿','Wohlbefinden','#79b98f',()=>state.stats.health<35?'Braucht Fürsorge':state.stats.health<70?'Erholt sich':'Pudelwohl']
];
function mood(){const s=state.stats;if(state.sleeping)return ['😴','Schlummert friedlich','Psst… ich tanke Energie.'];if(s.health<30)return ['🥺','Braucht Fürsorge','Mir geht’s nicht so gut. Magst du dich um mich kümmern?'];if(s.hunger<22)return ['🍎','Riesiger Appetit','Mein Bauch knurrt! Hast du etwas Leckeres?'];if(s.energy<20)return ['😪','Müde','Ein kleines Nickerchen wäre jetzt schön.'];if(s.happiness<28)return ['🥹','Ein bisschen einsam','Hast du Zeit für ein gemeinsames Spiel?'];if(s.hygiene<25)return ['🫧','Badezeit!','Ich glaube, ich brauche dringend ein Bad.'];if(s.happiness>75&&s.health>65)return ['🥰','Überglücklich','Mit dir ist jeder Tag ein Abenteuer!'];return ['😊','Gut gelaunt','Hey! Schön, dass du da bist! 👋']}
function renderStats(){$('stats').innerHTML=statMeta.map(([key,emoji,label,color,desc])=>`<div class="stat"><div class="stat-emoji">${emoji}</div><div><div class="stat-name">${label} <span style="font-weight:600;color:#9ba2ad">· ${desc()}</span></div><div class="bar"><span style="width:${state.stats[key]}%;background:${color}"></span></div></div><div class="stat-value">${Math.round(state.stats[key])}%</div></div>`).join('')}
const allAchievements=[
 ['firstFeed','🍎','Erste Mahlzeit','Füttere deinen Mitbewohner zum ersten Mal.'],
 ['playful','🎾','Spielgefährte','Spiele fünfmal zusammen.'],
 ['clean','🫧','Blitzblank','Gönne deinem Mitbewohner ein Bad.'],
 ['collector','🪴','Kleine Sammlerwelt','Kaufe ein Deko-Objekt.'],
 ['level2','⭐','Es geht los!','Erreiche Level 2.']
];
function renderAchievements(){$('achievementCount').textContent=allAchievements.filter(a=>state.achievements[a[0]]).length+' von '+allAchievements.length;$('achievements').innerHTML=allAchievements.map(a=>`<div class="log-row" style="opacity:${state.achievements[a[0]]?1:.48}"><span>${state.achievements[a[0]]?'✅':a[1]}</span><div><strong>${a[2]}</strong><div style="font-weight:500;color:#8d94a0;margin-top:3px">${a[3]}</div></div></div>`).join('')}
function checkAchievements(){if(state.actions.feed>0)state.achievements.firstFeed=true;if(state.actions.play>=5)state.achievements.playful=true;if(state.actions.wash>0)state.achievements.clean=true;if(state.inventory.length>3)state.achievements.collector=true;if(state.level>=2)state.achievements.level2=true}
function render(){tick();const m=mood();$('coins').textContent=state.coins;$('petNameLabel').textContent=state.name;$('petNameHeading').textContent=state.name;$('level').textContent=state.level;$('xpLabel').textContent=`${state.xp}/100 Erfahrungspunkte`;$('xpBar').style.width=state.xp+'%';$('moodTag').textContent=m[0]+' '+m[1];$('speech').textContent=m[2];$('character').classList.toggle('sleeping',state.sleeping);$('character').classList.toggle('sick',state.stats.health<30);$('lastUpdate').textContent='Stand: jetzt';$('roomTitle').textContent=state.level>3?'Dein kleines Paradies':state.level>1?'Hier wird’s gemütlich':'Ein gemütlicher Anfang';$('plantDecor').textContent=state.decor.plant==='flower'?'🌷':state.decor.plant==='cactus'?'🌵':'🪴';$('toyDecor').textContent=state.decor.toy==='ball'?'🎾':state.decor.toy==='duck'?'🦆':'🧸';$('bowlDecor').textContent=state.decor.bowl==='fancy'?'🍲':'🥣';renderStats();checkAchievements();renderAchievements();document.querySelectorAll('[data-action]').forEach(b=>{b.disabled=state.sleeping&&b.dataset.action!=='sleep'});$('dailyBtn').disabled=(new Date().toDateString()===new Date(state.lastGift).toDateString());$('dailyBtn').style.opacity=$('dailyBtn').disabled?'.55':'1';save()}
const actionData={
 feed:{cost:0,run(){if(state.stats.hunger>94){toast(`${state.name} ist schon pappsatt!`);return false}setStat('hunger',29);setStat('happiness',3);state.actions.feed++;gainXP(10);addLog('🍎',`${state.name} hat eine leckere Mahlzeit bekommen.`);toast('Knusper, knusper… lecker! 🍎');}},
 play:{cost:0,run(){if(state.stats.energy<18){toast(`${state.name} ist zu müde zum Spielen.`);return false}setStat('happiness',24);setStat('energy',-14);setStat('hunger',-8);state.actions.play++;gainXP(14);addLog('🎾',`Ihr habt zusammen gespielt. ${state.name} strahlt!`);$('character').classList.remove('happy');void $('character').offsetWidth;$('character').classList.add('happy');toast('Das hat Spaß gemacht! 🎉');}},
 wash:{cost:0,run(){setStat('hygiene',42);setStat('happiness',5);setStat('energy',-3);state.actions.wash++;gainXP(9);addLog('🫧',`${state.name} ist wieder blitzblank.`);toast('Frisch und sauber! 🫧');}},
 sleep:{cost:0,run(){state.sleeping=!state.sleeping;if(state.sleeping){addLog('🌙',`${state.name} kuschelt sich für ein Nickerchen ein.`);toast('Gute Ruhe, kleiner Freund. 🌙')}else{setStat('energy',20);addLog('☀️',`${state.name} ist ausgeruht aufgewacht.`);toast('Guten Morgen! ☀️')} }},
 treat:{cost:12,run(){if(state.stats.hunger>96){toast(`${state.name} ist schon satt.`);return false}if(state.coins<12){toast('Dafür fehlen dir Münzen.');return false}state.coins-=12;setStat('hunger',12);setStat('happiness',12);gainXP(5);addLog('🍪',`Ein besonderes Leckerli für ${state.name}!`);toast('Ein kleiner Glücksmoment! 🍪');}},
 clean:{cost:0,run(){setStat('hygiene',10);setStat('happiness',2);gainXP(5);addLog('🧹','Du hast das kleine Zuhause aufgeräumt.');toast('Alles wieder schön ordentlich! ✨');}}
};
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const action=actionData[b.dataset.action];if(!action)return;if(state.sleeping&&b.dataset.action!=='sleep')return;const result=action.run();if(result!==false){checkAchievements();render();}}));
$('character').addEventListener('click',()=>{if(state.sleeping){toast(`${state.name} schlummert gerade. 💭`);return}setStat('happiness',4);gainXP(2);toast(`${state.name} freut sich über deine Aufmerksamkeit! 💖`);$('character').classList.remove('happy');void $('character').offsetWidth;$('character').classList.add('happy');render()});
$('dailyBtn').addEventListener('click',()=>{if(new Date().toDateString()===new Date(state.lastGift).toDateString()){toast('Das Tagesgeschenk hast du schon abgeholt. 🎁');return}state.lastGift=now();state.coins+=30;setStat('happiness',5);gainXP(5);addLog('🎁','Du hast dein Tagesgeschenk abgeholt: 30 Münzen!');render();toast('Tagesgeschenk: 30 Münzen! 🪙')});
const items=[
 {id:'flower',icon:'🌷',name:'Blumentopf',desc:'Ein Farbtupfer für die Fensterbank.',cost:35,slot:'plant'},
 {id:'cactus',icon:'🌵',name:'Kleiner Kaktus',desc:'Pflegeleicht und ziemlich cool.',cost:30,slot:'plant'},
 {id:'ball',icon:'🎾',name:'Hüpfender Ball',desc:'Für noch mehr Spielspaß.',cost:45,slot:'toy'},
 {id:'duck',icon:'🦆',name:'Quietsche-Ente',desc:'Perfekt für die Badezeit.',cost:40,slot:'toy'},
 {id:'fancy',icon:'🍲',name:'Lieblingsnapf',desc:'Eine schicke Schüssel fürs Futter.',cost:50,slot:'bowl'},
 {id:'lamp',icon:'💡',name:'Sternenlicht',desc:'Ein warmes Licht für gemütliche Abende.',cost:65,slot:'lamp'},
 {id:'cloud',icon:'☁️',name:'Wolkenkissen',desc:'Weich landen und entspannen.',cost:55,slot:'rug'},
 {id:'rainbow',icon:'🌈',name:'Regenbogen-Deko',desc:'Ein bisschen Magie fürs Zimmer.',cost:80,slot:'wall'}
];
function openModal(title,content){$('modalTitle').textContent=title;$('modalContent').innerHTML=content;$('modalBackdrop').classList.add('open')}
function closeModal(){$('modalBackdrop').classList.remove('open')}
$('closeModal').addEventListener('click',closeModal);$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function openShop(){openModal('🛍️ Der kleine Laden',`<p class="empty-note">Mach es dir schön! Deine Deko bleibt in deiner Sammlung. Bereits gekaufte Dinge kannst du kostenlos aufstellen.</p><div class="shop-grid">${items.map(it=>{let owned=state.inventory.includes(it.id);return `<div class="shop-item"><div class="shop-art">${it.icon}</div><strong>${it.name}</strong><p>${it.desc}</p><button class="buy" data-buy="${it.id}" ${!owned&&state.coins<it.cost?'disabled':''}>${owned?'Aufstellen ✓':'🪙 '+it.cost+' Münzen'}</button></div>`}).join('')}</div>`);$('modalContent').querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>{const it=items.find(i=>i.id===b.dataset.buy);if(!state.inventory.includes(it.id)){if(state.coins<it.cost)return;state.coins-=it.cost;state.inventory.push(it.id);state.achievements.collector=true;gainXP(8);addLog(it.icon,`${it.name} ist in deine Sammlung eingezogen.`);toast(`${it.name} gekauft!`)}state.decor[it.slot]=it.id;render();openShop()}))}
function openCollection(){const owned=items.filter(i=>state.inventory.includes(i.id));openModal('🎒 Deine Sammlung',`<p class="empty-note">Hier findest du alles, was du bereits gesammelt hast. Tippe auf ein Objekt, um es im Zimmer aufzustellen.</p>${owned.length?`<div class="shop-grid">${owned.map(it=>`<div class="shop-item"><div class="shop-art">${it.icon}</div><strong>${it.name}</strong><p>${state.decor[it.slot]===it.id?'Gerade aufgestellt':'In deiner Sammlung'}</p><button class="buy" data-place="${it.id}">Aufstellen</button></div>`).join('')}</div>`:'<p>Noch ist deine Sammlung klein. Schau im Laden vorbei!</p>'}`);$('modalContent').querySelectorAll('[data-place]').forEach(b=>b.addEventListener('click',()=>{const it=items.find(i=>i.id===b.dataset.place);state.decor[it.slot]=it.id;render();openCollection();toast(`${it.name} aufgestellt!`)}))}
function openJournal(){openModal('📖 Dein Tagebuch',`<p class="empty-note">Die kleinen Momente eurer gemeinsamen Reise.</p><div class="log">${state.journal.map(j=>`<div class="log-row"><span>${j.icon}</span><div><div>${escapeHTML(j.text)}</div><div style="font-weight:500;color:#9b9ba2;margin-top:4px">${new Date(j.time).toLocaleString('de-DE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div></div>`).join('')}</div>`)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function settings(){openModal('⚙️ Einstellungen',`<label for="petNameInput" style="display:block;font-size:13px;font-weight:900;margin-bottom:8px">Wie soll dein Mitbewohner heißen?</label><input class="name-input" id="petNameInput" maxlength="16" value="${escapeHTML(state.name)}" placeholder="Name"><div style="display:flex;gap:9px;margin-top:12px"><button class="primary" id="saveName">Namen speichern</button><button class="primary danger" id="resetGame">Neu anfangen</button></div><div class="settings-row" style="margin-top:14px"><span>Automatisches Speichern</span><span class="mini-badge">✓ Aktiv</span></div><div class="settings-row"><span>Spielstand</span><span>Nur auf diesem Gerät</span></div><p class="empty-note">Dein Spielstand wird lokal in diesem Browser gespeichert. Wenn du Browserdaten löschst oder ein anderes Gerät verwendest, ist der Spielstand dort nicht automatisch verfügbar.</p><p class="empty-note">Miniwelt ist ein eigenständiges Fan-freies Originalspiel ohne Registrierung und ohne In-App-Käufe.</p>`);$('saveName').addEventListener('click',()=>{const n=$('petNameInput').value.trim().slice(0,16);if(!n){toast('Bitte gib einen Namen ein.');return}state.name=n;save();closeModal();render();toast(`Hallo, ${n}! 💛`)});$('resetGame').addEventListener('click',()=>{openModal('Neu anfangen?',`<p>Damit wird dein aktueller Spielstand auf diesem Gerät zurückgesetzt. Möchtest du wirklich von vorne beginnen?</p><div style="display:flex;gap:10px;margin-top:16px"><button class="primary danger" id="confirmReset">Ja, neu anfangen</button><button class="primary" id="cancelReset">Abbrechen</button></div>`);$('confirmReset').addEventListener('click',()=>{state=defaults();save();closeModal();render();toast('Ein frischer Start! 🌱')});$('cancelReset').addEventListener('click',settings)})}
$('settingsBtn').addEventListener('click',settings);
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));switch(b.dataset.tab){case'home':closeModal();break;case'shop':openShop();break;case'collection':openCollection();break;case'journal':openJournal();break}}));
if(!state.lastTick)state.lastTick=now();
tick();render();
// Keep needs gently changing while the game is open; elapsed-time simulation also works offline.
setInterval(()=>{render()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();render()}});
})();
</script>
</body>
</html>
